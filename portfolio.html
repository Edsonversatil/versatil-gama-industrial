<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio de Serviços | VERSÁTIL SERVICES</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#BF2026">
    <style>
        .portfolio-hero {
            padding: 120px 0 40px;
            text-align: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d0a0b 100%);
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .portfolio-hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 120%, rgba(191,32,38,0.25) 0%, transparent 60%);
            pointer-events: none;
        }
        .portfolio-hero h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 12px;
            position: relative; z-index: 1;
        }
        .portfolio-hero p {
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
            position: relative; z-index: 1;
        }
        .portfolio-hero .red-line {
            width: 60px; height: 4px;
            background: var(--red);
            margin: 16px auto 0;
            border-radius: 2px;
            position: relative; z-index: 1;
        }
        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 28px 0 20px;
            position: sticky;
            top: 60px;
            z-index: 50;
            background: rgba(245,245,245,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .filter-btn {
            padding: 10px 22px;
            border: 2px solid #ddd;
            background: #fff;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #555;
        }
        .filter-btn:hover { border-color: var(--red); color: var(--red); }
        .filter-btn.active {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
            box-shadow: 0 4px 14px rgba(191,32,38,0.3);
        }
        .filter-btn .count {
            display: inline-block;
            background: rgba(0,0,0,0.1);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 6px;
        }
        .filter-btn.active .count { background: rgba(255,255,255,0.25); }
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            padding: 30px 0 60px;
        }
        .portfolio-item {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            cursor: pointer;
            animation: fadeInUp 0.5s ease both;
        }
        .portfolio-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 32px rgba(191,32,38,0.15);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .portfolio-img {
            height: 220px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .portfolio-img::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: linear-gradient(transparent, rgba(0,0,0,0.4));
        }
        .portfolio-cat-badge {
            position: absolute;
            top: 12px; left: 12px;
            background: var(--red);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
        }
        .portfolio-zoom {
            position: absolute;
            top: 12px; right: 12px;
            width: 36px; height: 36px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
            font-size: 1.1rem;
        }
        .portfolio-item:hover .portfolio-zoom { opacity: 1; }
        .portfolio-info {
            padding: 16px 18px;
        }
        .portfolio-info h4 {
            margin: 0 0 4px;
            color: #1a1a1a;
            font-size: 1rem;
            font-weight: 700;
        }
        .portfolio-info .sub {
            color: #888;
            font-size: 0.82rem;
        }
        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .lightbox.open { display: flex; }
        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }
        .lightbox-close {
            position: absolute;
            top: 20px; right: 24px;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
            font-weight: 300;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border: none;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.25); }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        .lightbox-caption {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 8px 24px;
            border-radius: 20px;
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px 0;
            color: #666;
            font-size: 0.9rem;
        }
        .stats-bar strong { color: var(--red); font-size: 1.3rem; }
    </style>
</head>
<body>
    <header class="navbar" id="top">
        <div class="navbar-inner">
            <a href="index.html" class="logo">VERSÁTIL SERVICES</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="portfolio.html" style="color: var(--red); font-weight: 800;">Portfólio</a>
                <a href="solicitar.html">Solicitar Serviço</a>
            </nav>
            <div class="nav-actions">
                <a href="solicitar.html" class="btn-nav" style="background: var(--red); color: #fff; border-color: var(--red);">Solicitar Serviço</a>
            </div>
        </div>
    </header>

    <section class="portfolio-hero">
        <h1>Galeria de Serviços</h1>
        <p>Conheça nossos trabalhos executados em campo e na oficina</p>
        <div class="red-line"></div>
    </section>

    <div class="container">
        <div class="stats-bar" id="statsBar"></div>
        <div class="filter-bar" id="filterBar"></div>
        <div class="portfolio-grid" id="portfolioGrid"></div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-inner">
                <div class="footer-brand">VERSÁTIL SERVICES</div>
                <p>&copy; 2002 Versátil Services. Todos os direitos reservados.</p>
                <p style="margin-top: 12px;"><a href="tecnico.html" style="color: rgba(255,255,255,0.5); font-size: 0.75rem;">🔧 Acesso Técnico</a></p>
            </div>
        </div>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">&#8249;</button>
        <img id="lightboxImg" src="" alt="">
        <button class="lightbox-nav lightbox-next" onclick="navLightbox(1)">&#8250;</button>
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <script>
    const CATEGORIAS = {
        rotativos:  { label: 'Equipamentos Rotativos', prefix: 'rotativos', count: 10 },
        manutencao: { label: 'Manutenção Industrial', prefix: 'manut_ind', count: 10 },
        usinagem:   { label: 'Usinagem de Campo', prefix: 'usinagem', count: 10 },
        trocadores: { label: 'Trocadores de Calor', prefix: 'troc_calor', count: 10 },
        end:        { label: 'Ensaios N.D.', prefix: 'end', count: 10 }
    };

    const TITULOS = {
        rotativos: ['Alinhamento a Laser','Retífica de Pista','Balanceamento Dinâmico','Troca de Pneus','Recuperação Estrutural','Manutenção de Eixo','Inspeção de Secador','Forno Rotativo','Rolete Guia','Tambor Rotativo'],
        manutencao: ['Parada de Manutenção','Caldeiraria Industrial','Torres e Vasos','Tubulação Industrial','Tanque de Armazenamento','Válvula de Controle','Caldeira Industrial','Enquadramento NR13','Fiscalização de Obra','Manutenção Preventiva'],
        usinagem: ['Faceamento de Flange','Fresagem de Base','Mandrilhamento','Biselamento de Tubo','Retífica de Pista','Pino de Virabrequim','Ponta de Eixo','Usinagem In Loco','Flange RTJ','Torneamento de Campo'],
        trocadores: ['Retubagem Completa','Limpeza Química','Feixe Tubular','Mandrilhamento','Teste Hidrostático','Troca de Espelhos','Hidrojateamento','Serpentina Industrial','Resfriador a Ar','Fabricação Completa'],
        end: ['Líquido Penetrante','Partícula Magnética','Ultrassom Industrial','Radiografia','Ensaio Visual','PMI - Ligas Metálicas','Inspeção de Pintura','Fabricação e Inspeção','Alpinismo Industrial','Controle de Qualidade']
    };

    // Build foto array
    const fotos = [];
    Object.entries(CATEGORIAS).forEach(([cat, cfg]) => {
        for (let i = 1; i <= cfg.count; i++) {
            fotos.push({
                categoria: cat,
                src: `Fotos/${cfg.prefix}_${i}.png`,
                titulo: TITULOS[cat][i - 1],
                catLabel: cfg.label
            });
        }
    });

    let filtroAtual = 'todos';
    let lightboxIdx = 0;
    let fotosVisiveis = [];

    function renderStats() {
        const total = fotos.length;
        const cats = Object.keys(CATEGORIAS).length;
        document.getElementById('statsBar').innerHTML = `
            <div><strong>${total}</strong> Registros</div>
            <div><strong>${cats}</strong> Categorias</div>
            <div><strong>+20</strong> Anos de Experiência</div>
        `;
    }

    function renderFilters() {
        const bar = document.getElementById('filterBar');
        let html = `<button class="filter-btn active" onclick="filtrar('todos', this)">Todos <span class="count">${fotos.length}</span></button>`;
        Object.entries(CATEGORIAS).forEach(([cat, cfg]) => {
            html += `<button class="filter-btn" onclick="filtrar('${cat}', this)">${cfg.label} <span class="count">${cfg.count}</span></button>`;
        });
        bar.innerHTML = html;
    }

    function filtrar(categoria, btn) {
        filtroAtual = categoria;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');

        fotosVisiveis = categoria === 'todos' ? [...fotos] : fotos.filter(f => f.categoria === categoria);
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('portfolioGrid');
        grid.innerHTML = '';
        fotosVisiveis.forEach((foto, idx) => {
            const item = document.createElement('div');
            item.className = 'portfolio-item';
            item.style.animationDelay = `${idx * 0.04}s`;
            item.onclick = () => openLightbox(idx);
            item.innerHTML = `
                <div class="portfolio-img" style="background-image: url('${foto.src}');">
                    <span class="portfolio-cat-badge">${foto.catLabel}</span>
                    <span class="portfolio-zoom">🔍</span>
                </div>
                <div class="portfolio-info">
                    <h4>${foto.titulo}</h4>
                    <span class="sub">${foto.catLabel}</span>
                </div>
            `;
            grid.appendChild(item);
        });
    }

    function openLightbox(idx) {
        lightboxIdx = idx;
        const foto = fotosVisiveis[idx];
        document.getElementById('lightboxImg').src = foto.src;
        document.getElementById('lightboxCaption').textContent = `${foto.titulo} — ${foto.catLabel}`;
        document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('open');
    }

    function navLightbox(dir) {
        event.stopPropagation();
        lightboxIdx = (lightboxIdx + dir + fotosVisiveis.length) % fotosVisiveis.length;
        const foto = fotosVisiveis[lightboxIdx];
        document.getElementById('lightboxImg').src = foto.src;
        document.getElementById('lightboxCaption').textContent = `${foto.titulo} — ${foto.catLabel}`;
    }

    document.getElementById('lightbox').addEventListener('click', (e) => {
        if (e.target === document.getElementById('lightbox')) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
        if (!document.getElementById('lightbox').classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navLightbox(-1);
        if (e.key === 'ArrowRight') navLightbox(1);
    });

    // Init
    renderStats();
    renderFilters();
    fotosVisiveis = [...fotos];
    renderGrid();
    </script>
</body>
</html>
