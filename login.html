<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versátil Services - Login do CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            text-align: center;
        }
        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        .logo span {
            color: #bf2026; /* Versatil Red */
        }
        .subtitle {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: #bf2026;
            box-shadow: 0 0 0 2px rgba(191, 32, 38, 0.2);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #bf2026;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }
        .btn-login:hover {
            background: #e3262d;
        }
        .error-message {
            color: #ff5b5b;
            font-size: 0.85rem;
            margin-top: 16px;
            display: none;
            background: rgba(255, 91, 91, 0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 91, 91, 0.2);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">Versátil<span>.</span>CRM</div>
        <div class="subtitle">Acesse com suas credenciais corporativas</div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Login (Usuário)</label>
                <input type="text" id="username" placeholder="Ex: admin" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login" id="btn-submit">Entrar no Sistema</button>
            <div class="error-message" id="error-message"></div>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const errorEl = document.getElementById('error-message');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Autenticando...';
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/api/crm/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    btn.textContent = 'Acesso Liberado!';
                    btn.style.background = '#2ea043'; // Green
                    setTimeout(() => {
                        window.location.href = '/crm';
                    }, 500);
                } else {
                    errorEl.textContent = data.error || 'Falha ao autenticar.';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Entrar no Sistema';
                }
            } catch (err) {
                errorEl.textContent = 'Erro de conexão com o servidor.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Entrar no Sistema';
            }
        });
    </script>
</body>
</html>
